<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos y Pedidos</title>
  <!-- Importamos Tailwind CSS para los estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
  </style>
</head>

<body class="bg-gray-100 font-sans pb-32">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-10">CATÁLOGO DE PRODUCTOS</h1>

    <nav id="category-tabs" class="flex flex-wrap justify-center gap-2 mb-8" aria-label="Categorías de productos"></nav>

    <!-- Cuadrícula de Productos -->
    <div id="product-catalog"
      class="grid grid-cols-1 lg:grid-cols-2 gap-5"></div>

    <!-- Modal para imagen a pantalla completa -->
    <div id="modal" class="fixed inset-0 bg-white bg-opacity-95 flex items-center justify-center z-50 hidden">
      <img id="modal-img" src="" alt="Imagen ampliada"
        class="max-h-[90vh] max-w-[90vw] rounded-lg bg-white object-contain shadow-2xl">
    </div>
  </div>

  <!-- Barra flotante de Pedido / WhatsApp -->
  <div id="cart-bar"
    class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg p-4 z-40 transform translate-y-full transition-transform duration-300">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <p class="text-sm font-semibold text-gray-700">Productos en el pedido: <span id="cart-count"
            class="text-indigo-600 font-bold">0</span></p>
        <p class="text-xs text-gray-500">Total estimado: <span id="cart-total"
            class="font-bold text-gray-800">$0,00</span></p>
      </div>
      <div class="flex gap-3 w-full sm:w-auto">
        <button id="btn-limpiar"
          class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-300 transition">Limpiar</button>
        <button id="btn-whatsapp"
          class="flex-1 sm:flex-none px-6 py-2 bg-green-600 text-white text-sm font-semibold rounded-lg hover:bg-green-700 transition flex items-center justify-center gap-2">
          <span>Descargar JPG y abrir WhatsApp</span>
        </button>
      </div>
    </div>
    <p class="max-w-4xl mx-auto mt-2 text-center text-xs text-gray-500">El JPG se descarga para adjuntarlo al chat antes de enviar el pedido.</p>
  </div>

  <!-- Script principal modular -->
  <script type="module">
    import { cambiarCantidad, limpiarPedido, calcularTotales, enviarWhatsApp, obtenerCantidad } from './pedido.js';

    const CARPETA_IMAGENES = 'imagenes/';
    const NUMERO_WHATSAPP = "5493813197488"; // Cambia por tu número
    const CATEGORIAS = ['Cera', 'Revividores', 'Shampoo', 'Accesorios', 'Limpiadores multi uso', 'Combos'];

    let productosGlobal = [];
    let combosGlobal = [];
    let categoriaActual = 'Todos';

    // Función que actualiza la interfaz de la barra inferior de pedidos
    function actualizarInterfazTotales(pedidoActual, productos, combos) {
      const cartBar = document.getElementById('cart-bar');
      const cartCount = document.getElementById('cart-count');
      const cartTotal = document.getElementById('cart-total');

      const { totalItems, precioTotalCalculado, hayPrecioPendiente } = calcularTotales(productos, combos);

      cartCount.textContent = totalItems;
      cartTotal.textContent = '$' + precioTotalCalculado.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
        + (hayPrecioPendiente ? ' + consultar precio' : '');

      if (totalItems > 0) {
        cartBar.classList.remove('translate-y-full');
      } else {
        cartBar.classList.add('translate-y-full');
      }
    }

    function escaparHtml(valor = '') {
      return String(valor).replace(/[&<>"']/g, caracter => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[caracter]);
    }

    function renderizarCategorias() {
      const nav = document.getElementById('category-tabs');
      const categorias = ['Todos', ...CATEGORIAS];
      nav.innerHTML = categorias.map(categoria => `
        <button type="button" data-categoria="${escaparHtml(categoria)}"
          class="rounded-full px-4 py-2 text-sm font-semibold transition ${categoriaActual === categoria
            ? 'bg-indigo-600 text-white'
            : 'bg-white text-gray-700 hover:bg-indigo-50'}">${escaparHtml(categoria)}</button>
      `).join('');
      nav.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          categoriaActual = button.dataset.categoria;
          renderizarCategorias();
          renderizarCatalogo();
        });
      });
    }

    function crearTarjetaProducto(product) {
      const card = document.createElement('article');
      card.className = 'bg-white rounded-xl shadow-md overflow-hidden transition hover:shadow-xl flex min-h-48 fade-in';
      const imagenProducto = product.foto
        ? `<img src="${CARPETA_IMAGENES}${encodeURIComponent(product.foto)}" alt="${escaparHtml(product.articulo)}"
            class="w-full h-full min-h-48 bg-white object-contain p-2 group-hover:scale-105 transition-transform duration-200"
            onerror="this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'flex min-h-48 w-full items-center justify-center bg-white p-4 text-center text-sm text-gray-500',textContent:'Foto oficial no disponible'}));">`
        : `<div class="flex min-h-48 w-full items-center justify-center bg-white p-4 text-center text-sm text-gray-500">Foto oficial del frasco pendiente</div>`;
      card.innerHTML = `
        <div class="w-2/5 sm:w-1/3 min-h-48 ${product.foto ? 'cursor-pointer group' : ''} bg-white flex items-center justify-center overflow-hidden">
          ${imagenProducto}
        </div>
        <div class="flex flex-1 flex-col justify-between p-4 min-w-0">
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">Cód: ${escaparHtml(product.codigo)}</span>
              <span class="text-xs text-gray-500">${escaparHtml(product.categoria || 'Accesorios')}</span>
            </div>
            <h3 class="text-sm font-semibold text-gray-800 mt-2">${escaparHtml(product.articulo)}</h3>
            <p class="text-xs text-gray-600 mt-2">${escaparHtml(product.descripcion || '')}</p>
            <div class="mt-3 flex items-center justify-between gap-2">
              <span class="text-xs text-gray-500 uppercase font-medium">Precio:</span>
              <span class="text-base font-bold text-indigo-600">${escaparHtml(product['venta por menor'] || 'Consultar precio')}</span>
            </div>
          </div>
          <div class="flex items-center justify-between bg-gray-50 p-2 mt-3 rounded-lg border border-gray-200">
            <button type="button" data-action="restar" data-codigo="${escaparHtml(product.codigo)}"
              aria-label="Quitar ${escaparHtml(product.articulo)}" class="w-8 h-8 bg-white border border-gray-300 rounded font-bold text-gray-600 hover:bg-gray-100">-</button>
            <span id="qty-${escaparHtml(product.codigo)}" class="text-sm font-bold text-gray-800">${obtenerCantidad(product.codigo)}</span>
            <button type="button" data-action="sumar" data-codigo="${escaparHtml(product.codigo)}"
              aria-label="Agregar ${escaparHtml(product.articulo)}" class="w-8 h-8 bg-white border border-gray-300 rounded font-bold text-gray-600 hover:bg-gray-100">+</button>
          </div>
        </div>
      `;
      conectarTarjeta(card, product.codigo);
      return card;
    }

    function precioVentaCombo(combo) {
      if (!Array.isArray(combo.articulos) || combo.articulos.length === 0) return null;
      let totalEnCentavos = 0;
      for (const codigo of combo.articulos) {
        const producto = productosGlobal.find(item => item.codigo === codigo);
        if (!producto || !producto['precio combo']) return null;
        const precio = Number.parseFloat(String(producto['precio combo']).replace('$', '').replace(/\./g, '').replace(',', '.'));
        if (!Number.isFinite(precio) || precio < 0) return null;
        totalEnCentavos += Math.round(precio * 100);
      }
      return Math.ceil(totalEnCentavos / 100);
    }

    function crearTarjetaCombo(combo, index) {
      const codigo = `COMBO-${index}`;
      const articulos = Array.isArray(combo.articulos) ? combo.articulos : [];
      const componentes = articulos.map(codigoArticulo => {
        const producto = productosGlobal.find(item => item.codigo === codigoArticulo);
        return producto ? `${producto.articulo} (${producto.codigo})` : `Código no encontrado: ${codigoArticulo}`;
      }).join(', ');
      const precio = precioVentaCombo(combo);
      const card = document.createElement('article');
      card.className = 'bg-white rounded-xl shadow-md p-5 flex flex-col sm:flex-row gap-5 justify-between fade-in';
      card.innerHTML = `
        <div class="flex-1 min-w-0">
          <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">COMBO</span>
          <h3 class="text-lg font-semibold text-gray-800 mt-3">${escaparHtml(combo.titulo)}</h3>
          <p class="text-sm text-gray-600 mt-2">${escaparHtml(componentes)}</p>
          <p class="text-xs text-gray-500 mt-2">Precio calculado sumando los precios combo de sus productos.</p>
          <p class="text-lg font-bold text-indigo-600 mt-3">${precio === null
            ? 'Precio no disponible: revisa los códigos y precios combo.'
            : '$' + precio.toLocaleString('es-AR')}</p>
        </div>
        ${combo.foto ? `<img src="${CARPETA_IMAGENES}${encodeURIComponent(combo.foto)}"
          alt="Imagen de ${escaparHtml(combo.titulo)}"
          class="w-full sm:w-1/3 max-h-96 object-contain rounded-lg cursor-pointer bg-gray-50">` : ''}
        <div class="flex items-center justify-between bg-gray-50 p-2 mt-4 sm:mt-0 rounded-lg border border-gray-200 self-end sm:self-center">
          <button type="button" data-action="restar" data-codigo="${codigo}" aria-label="Quitar combo"
            class="w-8 h-8 bg-white border border-gray-300 rounded font-bold text-gray-600 hover:bg-gray-100">-</button>
          <span id="qty-${codigo}" class="text-sm font-bold text-gray-800">${obtenerCantidad(codigo)}</span>
          <button type="button" data-action="sumar" data-codigo="${codigo}" aria-label="Agregar combo" ${precio === null ? 'disabled' : ''}
            class="w-8 h-8 bg-white border border-gray-300 rounded font-bold text-gray-600 hover:bg-gray-100 disabled:opacity-40">+</button>
        </div>
      `;
      conectarTarjeta(card, codigo);
      return card;
    }

    function conectarTarjeta(card, codigo) {
      const image = card.querySelector('img');
      if (image) {
        image.addEventListener('click', () => {
          const modal = document.getElementById('modal');
          const modalImg = document.getElementById('modal-img');
          modalImg.src = image.src;
          modalImg.alt = image.alt;
          modal.classList.remove('hidden');
        });
      }
      card.querySelectorAll('button[data-action]').forEach(button => {
        button.addEventListener('click', () => {
          const delta = button.dataset.action === 'sumar' ? 1 : -1;
          cambiarCantidad(codigo, delta, productosGlobal, actualizarInterfazTotales, combosGlobal);
        });
      });
    }

    function renderizarCatalogo() {
      const catalogContainer = document.getElementById('product-catalog');
      catalogContainer.replaceChildren();
      const fragment = document.createDocumentFragment();
      const verCombos = categoriaActual === 'Todos' || categoriaActual === 'Combos';
      const productos = categoriaActual === 'Todos'
        ? productosGlobal
        : categoriaActual === 'Combos'
          ? []
          : productosGlobal.filter(product => product.categoria === categoriaActual);

      productos.forEach(product => fragment.appendChild(crearTarjetaProducto(product)));
      if (verCombos) {
        combosGlobal.forEach((combo, index) => fragment.appendChild(crearTarjetaCombo(combo, index)));
      }
      if (!fragment.childNodes.length) {
        const mensaje = document.createElement('p');
        mensaje.className = 'text-center text-gray-500 col-span-full';
        mensaje.textContent = categoriaActual === 'Combos' ? 'Todavía no hay combos configurados.' : 'No hay productos en esta categoría.';
        fragment.appendChild(mensaje);
      }
      catalogContainer.appendChild(fragment);
    }

    async function loadProducts() {
      try {
        const [productosResponse, combosResponse] = await Promise.all([
          fetch('datos-productos.json'),
          fetch('combos.json')
        ]);
        if (!productosResponse.ok) throw new Error('No se pudo cargar datos-productos.json');
        if (!combosResponse.ok) throw new Error('No se pudo cargar combos.json');
        productosGlobal = await productosResponse.json();
        combosGlobal = await combosResponse.json();
        renderizarCategorias();
        renderizarCatalogo();
      } catch (error) {
        console.error('Error al cargar el catálogo:', error);
        document.getElementById('product-catalog').innerHTML = `<p class="text-center text-red-500 col-span-full">No se pudo cargar el catálogo. Asegúrate de usar un servidor local (ej. Live Server).</p>`;
      }
    }

    // Configuración de botones globales de la barra flotante
    document.getElementById('btn-limpiar').addEventListener('click', () => {
      limpiarPedido(productosGlobal, actualizarInterfazTotales, combosGlobal);
    });

    document.getElementById('btn-whatsapp').addEventListener('click', () => {
      enviarWhatsApp(productosGlobal, NUMERO_WHATSAPP, combosGlobal)
        .catch(error => {
          console.error('No se pudo preparar el pedido para WhatsApp:', error);
          window.alert('No se pudo generar la imagen del pedido. Intenta nuevamente.');
        });
    });

    // Control del modal de imagen
    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
      const modal = document.getElementById('modal');
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.add('hidden');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') modal.classList.add('hidden');
      });
    });
  </script>
</body>

</html>
